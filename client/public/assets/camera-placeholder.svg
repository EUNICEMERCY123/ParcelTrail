<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350" style="background:#1a1d20; font-family:system-ui, -apple-system, sans-serif;">
  <!-- Simulated Camera Snapshot Placeholder -->
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#2c3036" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Mailbox interior dark background with subtle grid -->
  <rect width="500" height="350" fill="#1e2227" />
  <rect width="500" height="350" fill="url(#grid)" />

  <!-- Camera Reticle / Viewfinder Corners -->
  <path d="M 30 60 L 30 30 L 60 30" fill="none" stroke="#0dcaf0" stroke-width="3" />
  <path d="M 470 60 L 470 30 L 440 30" fill="none" stroke="#0dcaf0" stroke-width="3" />
  <path d="M 30 290 L 30 320 L 60 320" fill="none" stroke="#0dcaf0" stroke-width="3" />
  <path d="M 470 290 L 470 320 L 440 320" fill="none" stroke="#0dcaf0" stroke-width="3" />

  <!-- Crosshair in center -->
  <circle cx="250" cy="175" r="35" fill="none" stroke="#0dcaf0" stroke-dasharray="4,4" stroke-width="1.5" />
  <line x1="250" y1="130" x2="250" y2="220" stroke="#0dcaf0" stroke-width="1" />
  <line x1="205" y1="175" x2="295" y2="175" stroke="#0dcaf0" stroke-width="1" />

  <!-- Simulated Parcel Box inside compartment -->
  <polygon points="170,160 250,120 330,160 250,200" fill="#d4a373" stroke="#b08968" stroke-width="2" />
  <polygon points="170,160 250,200 250,260 170,220" fill="#bc6c25" stroke="#99582a" stroke-width="2" />
  <polygon points="250,200 330,160 330,220 250,260" fill="#ddb892" stroke="#b08968" stroke-width="2" />

  <!-- Simulated Badge / Watermark -->
  <rect x="25" y="20" width="130" height="26" rx="4" fill="#ffc107" />
  <text x="90" y="38" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">SIMULATED PHOTO</text>

  <!-- Camera metadata labels -->
  <text x="465" y="38" fill="#adb5bd" font-size="12" text-anchor="end">CAM-01 [ACTIVE]</text>
  <text x="250" y="300" fill="#f8f9fa" font-size="14" font-weight="bold" text-anchor="middle">Smart Mailbox Compartment View</text>
  <text x="250" y="322" fill="#6c757d" font-size="12" text-anchor="middle">Timestamp: Simulated Event Verification Frame</text>
</svg>
