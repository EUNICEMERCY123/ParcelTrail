<!-- Public Tracking Lookup Page in Vanilla JavaScript and Bootstrap 5 (Module 1 HTML5 & Module 2 JavaScript) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track a Parcel - ParcelTrail (Module 2 Vanilla JS)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/help.css">
</head>
<body>
  <header class="top-bar">
    <div class="top-bar-left">
      <a href="/" class="brand-logo">
        <div class="brand-icon-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
            <line x1="12" y1="22.08" x2="12" y2="12"></line>
          </svg>
        </div>
        <div style="display: flex; flex-direction: column; line-height: 1.15;">
          <span class="brand-name">ParcelTrail</span>
          <span class="brand-sub">Smart mailbox, secure parcels</span>
        </div>
      </a>
    </div>
    <nav class="top-bar-right">
      <ul class="nav-links-list">
        <li><a href="/" class="nav-link">Home</a></li>
        <li><a href="/my-parcels" class="nav-link">My parcels</a></li>
        <li><a href="/records" class="nav-link">Records</a></li>
        <li><a href="/pickup-points" class="nav-link">Pickup spots</a></li>
        <li><a href="/track.html" class="nav-link active">Track</a></li>
        <li><a href="/help.html" class="nav-link">Help</a></li>
      </ul>
    </nav>
  </header>

  <main class="container py-5" style="max-width: 560px;">
    <div class="text-center mb-4">
      <span class="eyebrow-badge">Live custody</span>
      <h1 class="fw-bold text-dark mb-2" style="font-size: 32px;">Track a <em>parcel.</em></h1>
      <p class="text-secondary small">Enter your delivery tracking number to view real-time custody events.</p>
    </div>

    <!-- Search Form -->
    <div class="card shadow-sm border p-4 mb-4 bg-white rounded-4">
      <form id="track-form">
        <label for="tracking-input" class="form-label fw-semibold small text-secondary mb-2">Tracking Number</label>
        <div class="d-flex gap-2">
          <input
            type="text"
            id="tracking-input"
            class="form-control rounded-pill px-3"
            placeholder="e.g. TRK-48291-IN"
            aria-label="Tracking Number"
            style="height: 48px; font-size: 15px;"
            required
          >
          <button type="submit" id="btn-track-submit" class="btn btn-primary fw-semibold px-4 rounded-pill" style="height: 48px;">
            Track
          </button>
        </div>
      </form>

      <!-- Clickable Recent Searches Chips -->
      <div id="recent-searches-box" class="mt-3 d-none">
        <span class="small text-muted me-2">Recent:</span>
        <div id="recent-chips" class="d-inline-flex flex-wrap gap-2"></div>
      </div>
    </div>

    <!-- Feedback alerts (loading, validation error, not-found) -->
    <div id="track-alert" class="alert d-none py-2" role="alert"></div>

    <!-- Result Card -->
    <div id="track-result-card" class="card shadow-sm border bg-white rounded-4 p-4 d-none">
      <div class="d-flex justify-content-between align-items-start mb-3 border-bottom pb-3">
        <div>
          <h2 id="result-item" class="h5 fw-bold text-dark mb-1"></h2>
          <div class="small text-muted">Sender: <span id="result-sender" class="text-secondary fw-medium"></span></div>
          <div class="small text-muted">Tracking: <span id="result-tracking" class="font-monospace text-secondary"></span></div>
        </div>
        <span id="result-badge" class="badge py-2 px-3 fs-6 rounded-pill"></span>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-sm-6">
          <div class="small text-muted">Location</div>
          <div id="result-location" class="fw-semibold text-dark"></div>
        </div>
        <div class="col-sm-6">
          <div class="small text-muted">Expected on</div>
          <div id="result-expected" class="fw-semibold text-dark"></div>
        </div>
      </div>

      <h3 class="h6 fw-bold text-dark mb-2">Custody Timeline</h3>
      <ul id="result-events" class="list-group list-group-flush border rounded-3"></ul>
    </div>
  </main>

  <script src="/js/track.js"></script>
</body>
</html>
